{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      type="image/png"
      href="{% static 'images/splash.svg' %}"
    />
    <title>Dog Collector</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    {% block head %} {% endblock %}
  </head>
  <body>
    <header>
      <div class="header-logo-container">
        <a href="/">
          <img
            src="{% static 'images/logotype.png' %}"
            alt="The Dog Collector Logo"
          />
        </a>
      </div>
      <nav>
        <ul>
          {% if user.is_authenticated %}
          <li><a href="{% url 'dog-index' %}">ALL DOGS</a></li>
          <li><a href="{% url 'toy-index' %}">ALL TOYS</a></li>
          <li><a href="{% url 'dog-create' %}">ADD A DOG</a></li>
          <li><a href="{% url 'toy-create' %}">ADD A TOY</a></li>
          <li><a href="{% url 'about' %}">ABOUT</a></li>
          <li>
            <form id="logout-form" method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit">SIGN OUT</button>
            </form>
          </li>
          {% else %}
          <li><a href="{% url 'about' %}">ABOUT</a></li>
          <li><a href="{% url 'home' %}">LOG IN</a></li>
          <li><a href="{% url 'signup' %}">SIGN UP</a></li>
          {% endif %}
        </ul>
      </nav>
    </header>
    <main>{% block content %} {% endblock %}</main>
  </body>
</html>
